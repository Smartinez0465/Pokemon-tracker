# Keeps data/sealed.json (the list of sealed products the app can recognise) up to date.
# Runs every Monday, and you can also run it by hand from the repo's Actions tab.
# To turn it off, delete this file.
name: Update sealed product list

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild data/sealed.json
        run: node tools/build-sealed.mjs
      - name: Commit if it changed
        id: commit
        run: |
          # the "generated" date changes every run, so only commit when the product list itself changed
          if git diff --quiet -I'"generated":"[0-9-]*"' data/sealed.json; then
            echo "No new products."
            git checkout -- data/sealed.json
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/sealed.json
            git commit -m "Update sealed product list"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the site
        if: steps.commit.outputs.changed == 'true'
        # pushes made by Actions don't always trigger a Pages build, so ask for one directly
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
